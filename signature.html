<html>
<head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<table style="border-collapse: collapse; --email-signature-theme: #35393B; font-family:Roboto,sans-serif;" cellspacing="0" cellpadding="0">
    <tbody>
    <tr>
        <td>
            <table style="border-collapse: collapse; line-height: 1; font-size: 13px;" cellspacing="0" cellpadding="0">
                <tbody>
                <tr>
                    <td style="vertical-align: top; padding-right: 25px;">
                        <table style="border-collapse: collapse;" cellspacing="0" cellpadding="0">
                            <tbody>
                            <tr>
                                <td style="text-align: center; padding-bottom: 15px;">
                                    <a tabindex="0"
                                       style="display: block;"
                                       target="_blank"
                                       rel="noreferrer">
                                        <img alt="Saily" style="vertical-align: initial;" width="110"
                                             src="https://raw.githubusercontent.com/michalrybnik/email-signature/main/saily.png">
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </td>
                    <td valign="top" style="vertical-align: top;">
                        <table style="border-collapse: collapse;" cellspacing="0" cellpadding="0">
                            <tbody>
                            <tr>
                                <td role="button" tabindex="0">
                                    <table style="border-collapse: collapse;" cellspacing="0" cellpadding="0">
                                        <tbody>
                                        <tr>
                                            <td style="max-width: 369px; overflow-wrap: break-word; line-height: 1.5;">
                                                <span style="font-weight: bold; line-height: 1;">
                                                    <span role="button" style="color: rgb(122, 122, 122); font-size: 18px;">
                                                        YOUR_NAME
                                                    </span>
                                                </span>
                                                <br>
                                                <span
                                                    style="font-size: 13px; color: rgb(122, 122, 122); margin-top: -4px;">YOUR_JOB_TITLE</span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td style="line-height: 0; padding-top: 15px; padding-bottom: 10px;">
                                    <table cellspacing="0" cellpadding="0" style="width: 100%;">
                                        <tbody>
                                        <tr>
                                            <td style="line-height: 0; font-size: 1pt; border-bottom: 1px solid rgb(53, 57, 59); min-width: 385px; max-width: 385px;">
                                                &nbsp;
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            <tr>
                                <td style="border-collapse: collapse;">
                                    <table style="border-collapse: collapse;" cellspacing="0" cellpadding="0">
                                        <tbody>
                                        <tr>
                                            <td style="width: 385px;" width="385">
                                                <table cellspacing="0" cellpadding="0">
                                                    <tbody>
                                                    <tr>
                                                        <td>
                                                            <table style="border-collapse: collapse;" cellspacing="0"
                                                                   cellpadding="0">
                                                                <tbody>
                                                                <tr>
                                                                    <td style="border-collapse: collapse;">
                                                                        <table cellspacing="0" cellpadding="0">
                                                                            <tbody>
                                                                            <tr>
                                                                                <td style="padding-right: 8px; text-align: center; padding-top: 0px; --icon-color: #35393B; --social-outline-border-radius: 50%;"
                                                                                    align="left" role="button"
                                                                                    tabindex="0">
                                                                                    <a href="YOUR_LINKEDIN_URL"
                                                                                       target="_blank" rel="noreferrer"><img
                                                                                            alt="linkedin icon"
                                                                                            style="float: left; border: medium;"
                                                                                            width="32" height="32"
                                                                                            src="https://raw.githubusercontent.com/michalrybnik/email-signature/main/li.png"></a>
                                                                                </td>
                                                                                <td style="padding-right: 8px; text-align: center; padding-top: 0px; --icon-color: #35393B; --social-outline-border-radius: 50%;"
                                                                                    align="left" role="button"
                                                                                    tabindex="0">
                                                                                    <a href="YOUR_COMPANY_LINKEDIN_URL"
                                                                                       target="_blank" rel="noreferrer"><img
                                                                                            alt="linkedin icon"
                                                                                            style="float: left; border: medium;"
                                                                                            width="32" height="32"
                                                                                            src="https://raw.githubusercontent.com/michalrybnik/email-signature/main/li.png"></a>
                                                                                </td>
                                                                                <td style="padding-right: 8px; text-align: center; padding-top: 0px; --icon-color: #35393B; --social-outline-border-radius: 50%;"
                                                                                    align="left" role="button"
                                                                                    tabindex="0">
                                                                                    <a href="YOUR_FACEBOOK_URL"
                                                                                       target="_blank" rel="noreferrer"><img
                                                                                            alt="facebook icon"
                                                                                            style="float: left; border: medium;"
                                                                                            width="32" height="32"
                                                                                            src="https://raw.githubusercontent.com/michalrybnik/email-signature/main/fb.png"></a>
                                                                                </td>
                                                                                <td style="padding-right: 8px; text-align: center; padding-top: 0px; --icon-color: #35393B; --social-outline-border-radius: 50%;"
                                                                                    align="left" role="button"
                                                                                    tabindex="0">
                                                                                    <a href="YOUR_INSTAGRAM_URL"
                                                                                       target="_blank" rel="noreferrer"><img
                                                                                            alt="instagram icon"
                                                                                            style="float: left; border: medium;"
                                                                                            width="32" height="32"
                                                                                            src="https://raw.githubusercontent.com/michalrybnik/email-signature/main/in.png"></a>
                                                                                </td>
                                                                            </tr>
                                                                            </tbody>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                                </tbody>
                                                            </table>
                                                        </td>
                                                    </tr>
                                                    </tbody>
                                                </table>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </td>
                </tr>
                </tbody>
            </table>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
